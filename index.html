<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04121f">
<meta name="color-scheme" content="dark">
<title>myLUAS · Live tram times</title>
<style>
  :root {
    --abyss: #030c16;
    --deep: #06192b;
    --sea: #0e6fa8;
    --sea-2: #1aa3d9;
    --aqua: #5fe0ff;
    --glass: rgba(18, 52, 82, .55);
    --glass-2: rgba(26, 72, 110, .55);
    --edge: rgba(140, 210, 255, .16);
    --shine: rgba(255, 255, 255, .10);
    --ink: #f2f8ff;
    --soft: #b9cee0;
    --muted: #7f9bb4;
    --red: #ff4d6a;
    --green: #2fe08a;
    --amber: #ffd166;
    --err-bg: rgba(120, 20, 40, .45);
    --err-ink: #ffc2cc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(26, 163, 217, .35), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(14, 111, 168, .30), transparent 60%),
      radial-gradient(800px 600px at 50% 120%, rgba(95, 224, 255, .18), transparent 60%),
      linear-gradient(180deg, var(--deep) 0%, var(--abyss) 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }

  /* Slow-moving light caustics in the background */
  body::before {
    content: ""; position: fixed; inset: -20%;
    background:
      radial-gradient(closest-side, rgba(95, 224, 255, .10), transparent) 20% 30% / 420px 420px no-repeat,
      radial-gradient(closest-side, rgba(26, 163, 217, .10), transparent) 75% 65% / 520px 520px no-repeat;
    animation: drift 22s ease-in-out infinite alternate;
    pointer-events: none; z-index: 0;
  }
  @keyframes drift { to { transform: translate(6%, -5%) rotate(8deg); } }

  .app {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 640px;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    gap: 16px;
  }

  /* Shared glossy glass surface */
  .glass {
    position: relative;
    background: linear-gradient(160deg, var(--glass-2) 0%, var(--glass) 55%, rgba(8, 28, 48, .6) 100%);
    border: 1px solid var(--edge);
    border-radius: 20px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow:
      0 18px 40px rgba(0, 0, 0, .45),
      inset 0 1px 0 rgba(255, 255, 255, .14),
      inset 0 -1px 0 rgba(0, 0, 0, .25);
    overflow: hidden;
  }
  .glass::before {               /* glossy top highlight */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 48%;
    background: linear-gradient(180deg, var(--shine), transparent);
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    position: relative;
    width: 42px; height: 42px; border-radius: 13px;
    background: linear-gradient(145deg, var(--aqua) 0%, var(--sea-2) 40%, var(--sea) 100%);
    display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(26, 163, 217, .45), inset 0 1px 0 rgba(255,255,255,.5);
    overflow: hidden;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 0 0 50% 0;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent);
  }
  .brand-mark svg { width: 24px; height: 24px; position: relative; z-index: 1; }
  .brand h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
  .brand h1 span {
    background: linear-gradient(90deg, var(--aqua), var(--sea-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: .8rem; color: var(--soft);
    font-variant-numeric: tabular-nums;
    padding: 7px 11px; border-radius: 999px;
    background: rgba(10, 36, 60, .6);
    border: 1px solid var(--edge);
    white-space: nowrap;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--aqua); flex-shrink: 0;
    box-shadow: 0 0 10px var(--aqua);
    animation: pulse 2s infinite;
  }
  .status.loading .dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .status.error .dot   { background: var(--red);   box-shadow: 0 0 10px var(--red); animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- Line switch ---------- */
  .field-label {
    display: block; font-size: .74rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted); margin: 0 0 7px 4px;
  }
  .line-switch {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 6px;
    border: 1px solid var(--edge);
    border-radius: 18px;
    background: rgba(6, 24, 42, .7);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.35);
  }
  .line-switch input { position: absolute; opacity: 0; pointer-events: none; }
  .line-switch label {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-size: 1.05rem; font-weight: 700;
    color: var(--soft);
    padding: 13px 10px;
    border-radius: 13px;
    cursor: pointer;
    transition: background .2s, color .2s, box-shadow .2s;
    user-select: none;
  }
  .line-switch label::before {
    content: ""; width: 11px; height: 11px; border-radius: 50%;
    background: var(--c); box-shadow: 0 0 8px var(--c);
  }
  .line-switch label:hover { color: var(--ink); }
  .line-switch
