<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>myLUAS · Live tram times</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #171b24;
    --panel-2: #1f2430;
    --ink: #f3f5f9;
    --muted: #8b93a7;
    --line: rgba(255,255,255,.08);
    --red: #e4002b;
    --green: #00a651;
    --accent: var(--green);
    --amber: #ffc94a;
    --err-bg: #3a1418;
    --err-ink: #ffb4bd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 100%;
    max-width: 640px;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    gap: 16px;
  }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--red) 0 50%, var(--green) 50% 100%);
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
  .brand h1 span { color: var(--accent); transition: color .3s; }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: .78rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }
  .status.loading .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .status.error .dot   { background: var(--red);   box-shadow: 0 0 8px var(--red); animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- Stop picker ---------- */
  .picker { position: relative; }
  .picker label {
    display: block; font-size: .72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin: 0 0 6px 4px;
  }
  select {
    width: 100%;
    appearance: none; -webkit-appearance: none;
    font: inherit; font-size: 1.1rem; font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 6px solid var(--accent);
    border-radius: 14px;
    padding: 15px 44px 15px 16px;
    cursor: pointer;
    transition: border-color .3s;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .picker::after {
    content: ""; position: absolute; right: 18px; bottom: 23px;
    width: 9px; height: 9px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); pointer-events: none;
  }

  /* ---------- Stop title ---------- */
  .stop-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 2px 4px; }
  .stop-title h2 { font-size: clamp(1.6rem, 7vw, 2.2rem); font-weight: 800; letter-spacing: -.02em; }
  .line-badge {
    font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  }

  /* ---------- Message ---------- */
  .message {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: .93rem; line-height: 1.45;
    color: #d5dae6;
  }
  .message svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; stroke: var(--amber); }

  .error-box {
    background: var(--err-bg);
    color: var(--err-ink);
    border: 1px solid rgba(255, 120, 135, .35);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: .93rem; line-height: 1.45;
    white-space: pre-wrap;
  }
  .error-box strong { color: #fff; display: block; margin-bottom: 2px; }

  /* ---------- Directions ---------- */
  .directions { display: grid; gap: 14px; }
  @media (min-width: 600px) { .directions { grid-template-columns: 1fr 1fr; } }

  .dir {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .dir h3 {
    font-size: .78rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted);
    padding: 14px 16px 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .dir h3::before {
    content: ""; width: 14px; height: 3px; border-radius: 2px; background: var(--accent);
  }
  .tram {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  .tram:first-of-type { background: var(--panel-2); }
  .dest { font-size: 1.08rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .due {
    display: flex; align-items: baseline; gap: 4px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .due b { font-size: 2.4rem; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
  .due small { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .due.now b {
    font-size: 1.7rem; color: var(--amber);
    animation: pulse 1.2s infinite;
  }
  .empty { padding: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .95rem; }

  /* Skeleton while first loading */
  .skeleton { height: 210px; border-radius: 18px; background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- Footer ---------- */
  footer {
    margin-top: auto;
    padding-top: 8px;
    text-align: center;
    font-size: .78rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .refresh-btn {
    font: inherit; font-size: .85rem; font-weight: 600;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; cursor: pointer;
    justify-self: center;
