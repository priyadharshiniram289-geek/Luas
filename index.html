<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04121f">
<meta name="color-scheme" content="dark">
<title>myLUAS · Live tram times</title>
<style>
  :root {
    --abyss: #030c16;
    --deep: #06192b;
    --sea: #0e6fa8;
    --sea-2: #1aa3d9;
    --aqua: #5fe0ff;
    --glass: rgba(18, 52, 82, .55);
    --glass-2: rgba(26, 72, 110, .55);
    --edge: rgba(140, 210, 255, .16);
    --shine: rgba(255, 255, 255, .10);
    --ink: #f2f8ff;
    --soft: #b9cee0;
    --muted: #7f9bb4;
    --red: #ff4d6a;
    --green: #2fe08a;
    --amber: #ffd166;
    --err-bg: rgba(120, 20, 40, .45);
    --err-ink: #ffc2cc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(26, 163, 217, .35), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(14, 111, 168, .30), transparent 60%),
      radial-gradient(800px 600px at 50% 120%, rgba(95, 224, 255, .18), transparent 60%),
      linear-gradient(180deg, var(--deep) 0%, var(--abyss) 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }

  /* Slow-moving light caustics in the background */
  body::before {
    content: ""; position: fixed; inset: -20%;
    background:
      radial-gradient(closest-side, rgba(95, 224, 255, .10), transparent) 20% 30% / 420px 420px no-repeat,
      radial-gradient(closest-side, rgba(26, 163, 217, .10), transparent) 75% 65% / 520px 520px no-repeat;
    animation: drift 22s ease-in-out infinite alternate;
    pointer-events: none; z-index: 0;
  }
  @keyframes drift { to { transform: translate(6%, -5%) rotate(8deg); } }

  .app {
    position: relative; z-index: 1;
    width: 100%;
    max-width: 640px;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    gap: 16px;
  }

  /* Shared glossy glass surface */
  .glass {
    position: relative;
    background: linear-gradient(160deg, var(--glass-2) 0%, var(--glass) 55%, rgba(8, 28, 48, .6) 100%);
    border: 1px solid var(--edge);
    border-radius: 20px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow:
      0 18px 40px rgba(0, 0, 0, .45),
      inset 0 1px 0 rgba(255, 255, 255, .14),
      inset 0 -1px 0 rgba(0, 0, 0, .25);
    overflow: hidden;
  }
  .glass::before {               /* glossy top highlight */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 48%;
    background: linear-gradient(180deg, var(--shine), transparent);
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    position: relative;
    width: 42px; height: 42px; border-radius: 13px;
    background: linear-gradient(145deg, var(--aqua) 0%, var(--sea-2) 40%, var(--sea) 100%);
    display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(26, 163, 217, .45), inset 0 1px 0 rgba(255,255,255,.5);
    overflow: hidden;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 0 0 50% 0;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent);
  }
  .brand-mark svg { width: 24px; height: 24px; position: relative; z-index: 1; }
  .brand h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; }
  .brand h1 span {
    background: linear-gradient(90deg, var(--aqua), var(--sea-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: .8rem; color: var(--soft);
    font-variant-numeric: tabular-nums;
    padding: 7px 11px; border-radius: 999px;
    background: rgba(10, 36, 60, .6);
    border: 1px solid var(--edge);
    white-space: nowrap;
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--aqua); flex-shrink: 0;
    box-shadow: 0 0 10px var(--aqua);
    animation: pulse 2s infinite;
  }
  .status.loading .dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .status.error .dot   { background: var(--red);   box-shadow: 0 0 10px var(--red); animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- Stop picker ---------- */
  .picker { position: relative; }
  .picker label {
    display: block; font-size: .74rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted); margin: 0 0 7px 4px;
  }
  select {
    width: 100%;
    appearance: none; -webkit-appearance: none;
    font: inherit; font-size: 1.15rem; font-weight: 600;
    color: var(--ink);
    background: linear-gradient(160deg, rgba(26, 72, 110, .75), rgba(10, 34, 58, .85));
    border: 1px solid var(--edge);
    border-radius: 16px;
    padding: 16px 48px 16px 18px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 26px rgba(0,0,0,.35);
  }
  select:focus { outline: 2px solid var(--aqua); outline-offset: 2px; }
  select option, select optgroup { background: #0a2238; color: var(--ink); }
  .picker::after {
    content: ""; position: absolute; right: 20px; bottom: 25px;
    width: 9px; height: 9px;
    border-right: 2px solid var(--aqua); border-bottom: 2px solid var(--aqua);
    transform: rotate(45deg); pointer-events: none;
  }

  /* ---------- Stop title ---------- */
  .stop-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 2px 4px; }
  .stop-title h2 {
    font-size: clamp(1.7rem, 7.5vw, 2.4rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.1;
    text-shadow: 0 2px 18px rgba(95, 224, 255, .25);
  }
  .line-badge {
    font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid currentColor;
    background: rgba(0,0,0,.25);
  }
  .line-badge.red   { color: var(--red); }
  .line-badge.green { color: var(--green); }

  /* ---------- Message & errors ---------- */
  .message {
    display: flex; gap: 11px; align-items: flex-start;
    padding: 13px 15px;
    font-size: .97rem;
    color: var(--soft);
  }
  .message svg { width: 21px; height: 21px; flex-shrink: 0; margin-top: 1px; stroke: var(--aqua); position: relative; }
  .message span { position: relative; }

  .error-box {
    background: var(--err-bg);
    color: var(--err-ink);
    border: 1px solid rgba(255, 120, 140, .4);
    border-radius: 16px;
    padding: 13px 15px;
    font-size: .95rem;
    white-space: pre-wrap;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .error-box strong { color: #fff; display: block; margin-bottom: 3px; }

  /* ---------- Directions ---------- */
  .directions { display: grid; gap: 14px; }
  @media (min-width: 600px) { .directions { grid-template-columns: 1fr 1fr; } }

  .dir h3 {
    position: relative;
    font-size: .8rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: .16em;
    color: var(--aqua);
    padding: 15px 18px 11px;
    display: flex; align-items: center; gap: 9px;
  }
  .dir h3::before {
    content: ""; width: 16px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, var(--aqua), var(--sea-2));
    box-shadow: 0 0 8px var(--aqua);
  }
  .tram {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 18px;
    border-top: 1px solid rgba(140, 210, 255, .10);
  }
  .tram.first {
    background: linear-gradient(90deg, rgba(95, 224, 255, .12), rgba(95, 224, 255, .02));
  }
  .dest { font-size: 1.12rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .due {
    display: flex; align-items: baseline; gap: 4px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .due b {
    font-size: 2.6rem; font-weight: 800; line-height: 1; letter-spacing: -.03em;
    background: linear-gradient(180deg, #ffffff 0%, #bfe9ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .due small { font-size: .88rem; color: var(--muted); font-weight: 700; }
  .due.now b {
    font-size: 1.8rem;
    background: none; color: var(--amber);
    text-shadow: 0 0 16px rgba(255, 209, 102, .55);
    animation: pulse 1.2s infinite;
  }
  .empty { position: relative; padding: 16px 18px; border-top: 1px solid rgba(140, 210, 255, .10); color: var(--muted); font-size: 1rem; }

  /* Skeleton while loading */
  .skeleton {
    height: 220px; border-radius: 20px;
    background: linear-gradient(90deg, rgba(18,52,82,.5) 0%, rgba(40,100,150,.5) 50%, rgba(18,52,82,.5) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border: 1px solid var(--edge);
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- Refresh & footer ---------- */
  .refresh-btn {
    align-self: center;
    font: inherit; font-size: .92rem; font-weight: 700;
    color: #022033;
    background: linear-gradient(180deg, #8beeff 0%, var(--sea-2) 55%, var(--sea) 100%);
    border: 0; border-radius: 999px;
    padding: 11px 22px; cursor: pointer;
    box-shadow: 0 10px 24px rgba(26, 163, 217, .4), inset 0 1px 0 rgba(255,255,255,.6);
    transition: transform .1s, filter .2s;
  }
  .refresh-btn:hover { filter: brightness(1.08); }
  .refresh-btn:active { transform: scale(.97); }

  footer {
    margin-top: auto;
    padding-top: 8px;
    text-align: center;
    font-size: .8rem;
    color: var(--muted);
  }

  .stale { opacity: .45; filter: grayscale(.6); }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="4" width="14" height="13" rx="3"/>
            <path d="M5 11h14M9 21l1.5-4M15 21l-1.5-4M9 2h6"/>
            <circle cx="9" cy="14" r=".6" fill="#fff"/><circle cx="15" cy="14" r=".6" fill="#fff"/>
          </svg>
        </div>
        <h1>my<span>LUAS</span></h1>
      </div>
      <div id="status" class="status loading" aria-live="polite">
        <span class="dot"></span><span id="statusText">Loading…</span>
      </div>
    </header>

    <div class="picker">
      <label for="stop">My stop</label>
      <select id="stop" aria-label="Choose your Luas stop">
        <option value="MYS">Loading stops…</option>
      </select>
    </div>

    <div id="stopsError" class="error-box hidden" role="alert"></div>

    <div class="stop-title">
      <h2 id="stopName">—</h2>
      <span id="lineBadge" class="line-badge hidden"></span>
    </div>

    <div id="message" class="message glass hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <span id="messageText"></span>
    </div>

    <div id="forecastError" class="error-box hidden" role="alert"></div>

    <section id="directions" class="directions" aria-live="polite">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>

    <button id="refreshBtn" class="refresh-btn" type="button">↻ Refresh now</button>

    <footer>
      Data: Transport Infrastructure Ireland. Built by Priyadharshini for BDAIB.
    </footer>
  </div>

<script>
  const API = "https://luas-class.kluxy.app";
  const STORAGE_KEY = "myluas-stop";
  const DEFAULT_STOP = "MYS";
  const REFRESH_MS = 20000;

  const el = id => document.getElementById(id);
  const select = el("stop");
  let stopsById = {};
  let timer = null;
  let requestId = 0;

  // ---------- localStorage (wrapped: it can be blocked in some browsers) ----------
  function loadStop() {
    try { return localStorage.getItem(STORAGE_KEY) || DEFAULT_STOP; }
    catch { return DEFAULT_STOP; }
  }
  function saveStop(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch { /* ignore */ }
  }

  // ---------- Helpers ----------
  function timeNow() {
    const d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":");
  }

  function setStatus(kind, text) {
    el("status").className = "status " + kind;
    el("statusText").textContent = text;
  }

  function showError(box, title, message) {
    box.innerHTML = "";
    const strong = document.createElement("strong");
    strong.textContent = title;
    box.appendChild(strong);
    box.appendChild(document.createTextNode(message));
    box.classList.remove("hidden");
  }

  function errText(err) {
    return err && err.message ? err.message : String(err);
  }

  function setLineBadge(line) {
    const badge = el("lineBadge");
    if (line === "red" || line === "green") {
      badge.textContent = line === "red" ? "Red Line" : "Green Line";
      badge.className = "line-badge " + line;
    } else {
      badge.className = "line-badge hidden";
    }
  }

  async function getJSON(url) {
    let res;
    try {
      res = await fetch(url, { cache: "no-store" });
    } catch (e) {
      throw new Error("Network error, could not reach " + url + " (" + e.message + ")");
    }
    const raw = await res.text();
    if (!res.ok) throw new Error("HTTP " + res.status + " from " + url + (raw ? ": " + raw.slice(0, 200) : ""));
    try { return JSON.parse(raw); }
    catch { throw new Error("Response from " + url + " was not valid JSON."); }
  }

  // ---------- 1. Stops dropdown, grouped by line ----------
  async function loadStops(selected) {
    try {
      const data = await getJSON(API + "/stops");
      if (!data || !Array.isArray(data.stops)) throw new Error('The stop list had no "stops" array.');

      const groups = { red: [], green: [] };
      for (const s of data.stops) {
        stopsById[s.id] = s;
        if (groups[s.line]) groups[s.line].push(s);
      }

      select.innerHTML = "";
      [["red", "Red Line"], ["green", "Green Line"]].forEach(([key, label]) => {
        if (!groups[key].length) return;
        const og = document.createElement("optgroup");
        og.label = label;
        groups[key].forEach(s => {
          const o = document.createElement("option");
          o.value = s.id;
          o.textContent = s.name;
          og.appendChild(o);
        });
        select.appendChild(og);
      });

      if (stopsById[selected]) select.value = selected;
      else if (stopsById[DEFAULT_STOP]) select.value = DEFAULT_STOP;
      el("stopsError").classList.add("hidden");
    } catch (err) {
      // Keep a usable dropdown with the saved stop so live times still work
      select.innerHTML = "";
      const o = document.createElement("option");
      o.value = selected; o.textContent = selected;
      select.appendChild(o);
      showError(el("stopsError"), "Couldn't load the stop list.", errText(err));
    }
    return select.value || selected;
  }

  // ---------- 2. Directions with the next three trams ----------
  function renderDirections(directions) {
    const wrap = el("directions");
    wrap.innerHTML = "";
    if (!directions.length) {
      const d = document.createElement("div");
      d.className = "dir glass";
      d.innerHTML = '<div class="empty">No direction information for this stop right now.</div>';
      wrap.appendChild(d);
      return;
    }
    directions.forEach(dir => {
      const card = document.createElement("article");
      card.className = "dir glass";
      const h = document.createElement("h3");
      h.textContent = dir.name || "Direction";
      card.appendChild(h);

      const trams = (Array.isArray(dir.trams) ? dir.trams : []).slice(0, 3);
      if (!trams.length) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "No trams forecast.";
        card.appendChild(e);
      }
      trams.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "tram" + (i === 0 ? " first" : "");

        const dest = document.createElement("div");
        dest.className = "dest";
        dest.textContent = t.destination || "—";

        const due = document.createElement("div");
        const mins = Number(t.due);
        const b = document.createElement("b");
        if (t.due === 0 || mins === 0 || String(t.due).toUpperCase() === "DUE") {
          due.className = "due now";
          b.textContent = "Due";
          due.appendChild(b);
        } else {
          due.className = "due";
          b.textContent = Number.isFinite(mins) ? mins : String(t.due);
          due.appendChild(b);
          if (Number.isFinite(mins)) {
            const s = document.createElement("small");
            s.textContent = "min";
            due.appendChild(s);
          }
        }
        row.appendChild(dest);
        row.appendChild(due);
        card.appendChild(row);
      });
      wrap.appendChild(card);
    });
  }

  // ---------- 3–5. Forecast, message, last updated, errors ----------
  async function loadForecast() {
    const stop = select.value || DEFAULT_STOP;
    const myId = ++requestId;               // ignore late replies for an old stop
    setStatus("loading", "Updating…");

    const known = stopsById[stop];
    if (known) { el("stopName").textContent = known.name; setLineBadge(known.line); }

    try {
      const data = await getJSON(API + "/forecast?stop=" + encodeURIComponent(stop));
      if (myId !== requestId) return;
      if (!data || typeof data !== "object") throw new Error("Forecast response was empty.");

      el("stopName").textContent = data.stopName || (known ? known.name : stop);

      const msg = (data.message || "").trim();
      el("messageText").textContent = msg;
      el("message").classList.toggle("hidden", !msg);

      renderDirections(Array.isArray(data.directions) ? data.directions : []);
      el("forecastError").classList.add("hidden");
      el("directions").classList.remove("stale");
      el("message").classList.remove("stale");
      setStatus("ok", "Last updated " + timeNow());
    } catch (err) {
      if (myId !== requestId) return;
      // First load: clear the skeleton. Later loads: keep and dim the old times.
      const hadOld = !el("directions").querySelector(".skeleton") && el("directions").children.length > 0;
      if (!hadOld) el("directions").innerHTML = "";
      el("directions").classList.toggle("stale", hadOld);
      el("message").classList.toggle("stale", hadOld);
      const note = hadOld ? "\nThe times below are from the last successful update and may be out of date." : "";
      showError(el("forecastError"), "Couldn't load live trams.", errText(err) + note);
      setStatus("error", "Update failed " + timeNow());
    }
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(loadForecast, REFRESH_MS);
  }

  // ---------- Events ----------
  select.addEventListener("change", () => {
    saveStop(select.value);
    el("directions").classList.remove("stale");
    el("directions").innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    loadForecast();
    startTimer();
  });

  el("refreshBtn").addEventListener("click", () => { loadForecast(); startTimer(); });

  // Refresh straight away when the user comes back to the tab
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { loadForecast(); startTimer(); }
  });

  // ---------- Start ----------
  (async function init() {
    const saved = loadStop();
    const stop = await loadStops(saved);
    saveStop(stop);
    await loadForecast();
    startTimer();
  })();
</script>
</body>
</html>
